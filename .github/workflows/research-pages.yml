name: Research Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run test suite
        run: pytest

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Discover candidates
        run: python -m ramanujan_discovery discover --depth 36 --precision 80 --budget-hours 0.12 --out results/candidates.jsonl

      - name: Verify candidates
        run: python -m ramanujan_discovery verify --in results/candidates.jsonl --precision 160 --out results/verified.jsonl

      - name: Build markdown report
        run: python -m ramanujan_discovery report --in results/verified.jsonl --out results/report.md

      - name: Build static site
        run: python -m ramanujan_discovery site --in results/verified.jsonl --out-dir docs --title "Ramanujan Discovery Lab"

      - name: Upload research snapshot
        uses: actions/upload-artifact@v4
        with:
          name: research-results
          path: results

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
