[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramanujan-discovery"
version = "0.1.0"
description = "CLI-first MVP for Ramanujan-style q-continued-fraction discovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mpmath>=1.3.0",
  "sympy>=1.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
ramanujan-discovery = "ramanujan_discovery.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
